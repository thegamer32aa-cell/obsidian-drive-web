<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://accounts.google.com https://apis.google.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com;
  frame-src https://accounts.google.com https://content.googleapis.com https://docs.google.com https://www.google.com;
  base-uri 'none';
  form-action 'none';
">
<title>Obsidian Vault (Drive)</title>
<style>
  :root{
    --bg:#111318; --panel:#1a1d24; --border:#2a2e37; --fg:#e6e8eb; --muted:#8b909b;
    --accent:#5b8def; --danger:#e5534b; --ok:#3fb950;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;height:100%;}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);position:sticky;top:0;z-index:5;}
  header h1{font-size:1rem;margin:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  header .sub{font-size:0.75rem;color:var(--muted);}
  button{font:inherit;border:1px solid var(--border);background:#20242c;color:var(--fg);border-radius:8px;padding:10px 14px;cursor:pointer;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  button:disabled{opacity:0.5;cursor:default;}
  main{flex:1;overflow-y:auto;padding:12px 16px 32px;}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
  .center-screen p{color:var(--muted);max-width:320px;line-height:1.5;font-size:0.9rem;}
  .breadcrumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:0.85rem;color:var(--muted);margin-bottom:10px;}
  .breadcrumbs button{border:none;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline;}
  ul.filelist{list-style:none;margin:0;padding:0;}
  ul.filelist li{border-bottom:1px solid var(--border);}
  ul.filelist li button{width:100%;text-align:left;border:none;background:none;border-radius:0;padding:14px 4px;display:flex;align-items:center;gap:10px;font-size:0.95rem;}
  ul.filelist li button .icon{width:22px;text-align:center;flex-shrink:0;}
  .empty{color:var(--muted);text-align:center;padding:24px;font-size:0.9rem;}
  .editor{display:flex;flex-direction:column;gap:10px;height:100%;}
  .editor textarea{flex:1;min-height:50vh;background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.9rem;line-height:1.5;resize:vertical;}
  .editor-actions{display:flex;gap:8px;justify-content:flex-end;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20242c;border:1px solid var(--border);color:var(--fg);padding:10px 16px;border-radius:8px;font-size:0.85rem;z-index:50;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
  .toast.error{border-color:var(--danger);}
  .badge{display:inline-block;font-size:0.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted);}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  a{color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1 id="titleText">Obsidian Vault</h1>
  <div id="headerActions"></div>
</header>

<main id="main">
  <div class="center-screen" id="loadingScreen">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>
</main>

<div id="toastHost"></div>

<!-- Google Identity Services: boton/flow de login -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- gapi: solo para el Picker (elegir la carpeta del vault) -->
<script src="https://apis.google.com/js/api.js" async defer></script>

<script src="app.js"></script>
</body>
</html>
