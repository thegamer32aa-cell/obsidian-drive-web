<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com;
  frame-src https://accounts.google.com https://content.googleapis.com https://docs.google.com https://www.google.com;
  base-uri 'none';
  form-action 'none';
">
<title>Obsidian Vault (Drive)</title>
<style>
:root{
  --bg:#1e1e1e; --bg-secondary:#161616; --bg-elevated:#262626;
  --border:#2e2e2e; --fg:#dcddde; --muted:#8a8a8a;
  --accent:#7c6cf0; --accent-fg:#ffffff;
  --danger:#e5534b; --ok:#3fb950;
  --sidebar-w:280px; --topbar-h:52px;
  /* alias de variables de tema de Obsidian, usadas por scripts dataviewjs portados del vault */
  --color-text-primary:var(--fg); --color-text-secondary:var(--muted); --color-text-tertiary:var(--muted);
  --color-background-secondary:var(--bg-secondary); --color-border-tertiary:var(--border);
  --interactive-accent:var(--accent);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
button{font:inherit;}
#app{display:flex;height:100%;}

#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--bg-secondary);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
#sidebar.open{transform:translateX(0);}
.sidebar-header{display:flex;align-items:center;gap:8px;padding:12px 10px;border-bottom:1px solid var(--border);}
.vault-name{flex:1;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-search{padding:8px 10px;border-bottom:1px solid var(--border);}
.sidebar-search input{width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--fg);
  border-radius:6px;padding:8px 10px;font-size:.85rem;}
.tree{flex:1;overflow-y:auto;padding:6px;}
.sidebar-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px 10px;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted);}
#sidebarEmail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none;}
#scrim.show{display:block;}

.tree-item{border-radius:6px;}
.tree-row{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;border-radius:6px;
  font-size:.85rem;color:var(--fg);user-select:none;}
.tree-row:hover{background:var(--bg-elevated);}
.tree-row .chev{width:14px;flex-shrink:0;text-align:center;color:var(--muted);font-size:.7rem;transition:transform .15s;}
.tree-row.collapsed .chev{transform:rotate(-90deg);}
.tree-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.tree-children{margin-left:14px;display:block;}
.tree-children.hidden{display:none;}

#contentCol{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;}
#topbar{
  min-height:var(--topbar-h);flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--border);background:var(--bg);
  padding-top:calc(env(safe-area-inset-top) + 6px);position:sticky;top:0;z-index:5;
}
#topbarActions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{background:none;border:1px solid transparent;color:var(--fg);border-radius:6px;
  width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.05rem;cursor:pointer;}
.icon-btn:hover{background:var(--bg-elevated);}
.icon-btn-wide{width:auto;padding:0 8px;font-size:.85rem;}
.only-mobile{display:none;}

.ctx-menu{position:fixed;z-index:60;background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.ctx-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fg);
  padding:9px 12px;border-radius:6px;font-size:.9rem;cursor:pointer;}
.ctx-menu button:hover{background:var(--bg-secondary);}
.ctx-menu button.danger{color:var(--danger);}
.ctx-menu-scrim{position:fixed;inset:0;z-index:59;}

.tabbar{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;}
.tabbar::-webkit-scrollbar{display:none;}
.tab{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:6px;
  background:var(--bg-elevated);border:1px solid transparent;font-size:.8rem;white-space:nowrap;
  cursor:pointer;flex-shrink:0;max-width:200px;color:var(--muted);}
.tab.active{border-color:var(--accent);color:var(--fg);}
.tab .tab-name{overflow:hidden;text-overflow:ellipsis;}
.tab.dirty .tab-name::after{content:" \2022";color:var(--accent);}
.tab .tab-close{opacity:.55;padding:0 2px;border-radius:4px;}
.tab .tab-close:hover{opacity:1;background:var(--bg);}

button.pill{background:var(--bg-elevated);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:8px 14px;cursor:pointer;font-size:.85rem;}
button.pill.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);}
button.pill:disabled{opacity:.5;}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.center-screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.center-screen p{color:var(--muted);max-width:340px;line-height:1.5;font-size:.9rem;}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:.9rem;}

.note-wrap{max-width:760px;margin:0 auto;padding:20px 20px 80px;}
.note-wrap textarea{
  width:100%;min-height:70vh;background:var(--bg-secondary);color:var(--fg);
  border:1px solid var(--border);border-radius:8px;padding:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem;line-height:1.6;resize:vertical;
}

.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.4em 0 .5em;}
.md h1{font-size:1.7em;border-bottom:1px solid var(--border);padding-bottom:.2em;}
.md h2{font-size:1.4em;}
.md h3{font-size:1.2em;}
.md h4{font-size:1.05em;color:var(--muted);}
.md p{line-height:1.65;margin:.7em 0;}
.md a{color:var(--accent);text-decoration:none;}
.md a:hover{text-decoration:underline;}
.md a.wikilink{border-bottom:1px dotted var(--accent);}
.md a.wikilink.broken{color:var(--danger);border-bottom-color:var(--danger);}
.md code{background:var(--bg-elevated);padding:.15em .35em;border-radius:4px;font-size:.85em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.md pre{background:var(--bg-secondary);border:1px solid var(--border);padding:12px 14px;border-radius:8px;overflow-x:auto;}
.md pre code{background:none;padding:0;}
.md blockquote{border-left:3px solid var(--accent);margin:.8em 0;padding:.2em 1em;color:var(--muted);}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0;line-height:1.6;}
.md li{margin:.2em 0;}
.md li.task{list-style:none;margin-left:-1.4em;display:flex;align-items:flex-start;gap:.4em;}
.md li.task input{margin-top:.35em;}
.md hr{border:none;border-top:1px solid var(--border);margin:1.6em 0;}
.md table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9em;}
.md th,.md td{border:1px solid var(--border);padding:.4em .6em;text-align:left;}
.md th{background:var(--bg-secondary);}
.md img{max-width:100%;border-radius:6px;}
.md .embed-missing{color:var(--muted);font-style:italic;font-size:.85em;}
.chart-wrap{background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;
  padding:14px;margin:1em 0;position:relative;height:320px;}
.djs-wrap{margin:1em 0;}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-elevated);
  border:1px solid var(--border);color:var(--fg);padding:10px 16px;border-radius:8px;font-size:.85rem;
  z-index:50;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.toast.error{border-color:var(--danger);}

@media (min-width:860px){
  #sidebar{position:static;transform:none;}
  #scrim{display:none !important;}
  .only-mobile{display:none !important;}
}
@media (max-width:859.98px){
  .only-mobile{display:flex;}
  #contentCol{width:100%;}
}
</style>
</head>
<body>

<div id="app">
  <div id="scrim"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="sidebarCloseBtn" class="icon-btn only-mobile" aria-label="Cerrar">✕</button>
      <div class="vault-name" id="vaultName">Vault</div>
      <button id="newNoteBtn" class="icon-btn" title="Nueva nota">📝</button>
      <button id="newFolderBtn" class="icon-btn icon-btn-wide" title="Nueva carpeta">📁+</button>
      <button id="changeFolderBtn" class="icon-btn" title="Cambiar carpeta">📂</button>
    </div>
    <div class="sidebar-search">
      <input id="searchInput" type="text" placeholder="Buscar nota...">
    </div>
    <nav id="tree" class="tree"></nav>
    <div class="sidebar-footer">
      <span id="sidebarEmail"></span>
      <button id="logoutBtn" class="icon-btn" title="Cerrar sesion">🚪</button>
    </div>
  </aside>

  <div id="contentCol">
    <header id="topbar">
      <button id="sidebarOpenBtn" class="icon-btn only-mobile" aria-label="Menu">☰</button>
      <div id="tabbar" class="tabbar"></div>
      <div id="topbarActions"></div>
    </header>
    <main id="main">
      <div class="center-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </main>
  </div>
</div>

<div id="toastHost"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="chart.umd.min.js"></script>

<script>
"use strict";
/* =========================================================================
   Obsidian Vault (Drive) - todo en un solo archivo (HTML + CSS + JS).
   Unica dependencia externa vendorizada: chart.umd.min.js (Chart.js, MIT).
   ========================================================================= */

/* ---------------------------------------------------------------------
   1) Motor de Markdown propio (estilo Obsidian): encabezados, listas,
   tareas clicables, tablas, citas, codigo, [[wikilinks]], ![[embeds]]
   y bloques ```chart renderizados con Chart.js.
   Todo el texto se escapa antes de insertar cualquier etiqueta, para que
   un nombre de nota "raro" nunca pueda inyectar HTML.
--------------------------------------------------------------------- */

function mdEscapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function mdSanitizeUrl(url) {
  const t = (url || "").trim();
  if (/^(https?:|mailto:)/i.test(t)) return t;
  if (/^[a-zA-Z0-9._\-/%# ]+$/.test(t)) return t;
  return "#";
}

function mdRenderInline(text, ctx) {
  let out = mdEscapeHtml(text);

  const codeTokens = [];
  out = out.replace(/`([^`]+)`/g, (m, code) => {
    const idx = codeTokens.push(code) - 1;
    return ` CODE${idx} `;
  });

  out = out.replace(/!\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, alias) => ctx.onEmbed(target.trim(), alias ? alias.trim() : null));
  out = out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, target, alias) => ctx.onWikilink(target.trim(), alias ? alias.trim() : null));
  out = out.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, alt, url) => ctx.onImage(mdSanitizeUrl(mdDecodeEntitiesLite(url)), alt));
  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, label, url) => {
    const safe = mdSanitizeUrl(mdDecodeEntitiesLite(url));
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  out = out.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
  out = out.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  out = out.replace(/ CODE(\d+) /g, (m, i) => `<code>${mdEscapeHtml(codeTokens[Number(i)])}</code>`);
  return out;
}

function mdDecodeEntitiesLite(s) {
  return s.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');
}

function renderMarkdown(source, ctx) {
  const lines = source.replace(/\r\n/g, "\n").split("\n");
  const html = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    const fence = line.match(/^```(.*)$/);
    if (fence) {
      const lang = fence[1].trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) {
        codeLines.push(lines[i]);
        i++;
      }
      i++;
      const langLower = lang.toLowerCase();
      if (langLower === "chart") {
        html.push(ctx.onChart(codeLines.join("\n")));
      } else if (langLower === "dataviewjs") {
        html.push(ctx.onDataviewJs(codeLines.join("\n")));
      } else {
        html.push(`<pre><code${lang ? ` data-lang="${mdEscapeHtml(lang)}"` : ""}>${mdEscapeHtml(codeLines.join("\n"))}</code></pre>`);
      }
      continue;
    }

    if (/^\s*$/.test(line)) { i++; continue; }

    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html.push("<hr>"); i++; continue; }

    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      html.push(`<h${level}>${mdRenderInline(heading[2].trim(), ctx)}</h${level}>`);
      i++;
      continue;
    }

    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      html.push(`<blockquote>${mdRenderInline(buf.join(" "), ctx)}</blockquote>`);
      continue;
    }

    if (/^\|.*\|\s*$/.test(line) && lines[i + 1] && /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
      const headerCells = splitTableRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) { rows.push(splitTableRow(lines[i])); i++; }
      let t = "<table><thead><tr>";
      for (const c of headerCells) t += `<th>${mdRenderInline(c, ctx)}</th>`;
      t += "</tr></thead><tbody>";
      for (const r of rows) { t += "<tr>"; for (const c of r) t += `<td>${mdRenderInline(c, ctx)}</td>`; t += "</tr>"; }
      t += "</tbody></table>";
      html.push(t);
      continue;
    }

    const listMatch = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (listMatch) {
      const ordered = /\d+\./.test(listMatch[2]);
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!m) break;
        items.push({ text: m[3], lineIndex: i });
        i++;
      }
      let l = ordered ? "<ol>" : "<ul>";
      for (const item of items) {
        const task = item.text.match(/^\[( |x|X)\]\s+(.*)$/);
        if (task) {
          const checked = task[1].toLowerCase() === "x";
          const cid = `cb-${item.lineIndex}`;
          l += `<li class="task"><input type="checkbox" id="${cid}" data-line="${item.lineIndex}" ${checked ? "checked" : ""}> <label for="${cid}">${mdRenderInline(task[2], ctx)}</label></li>`;
        } else {
          l += `<li>${mdRenderInline(item.text, ctx)}</li>`;
        }
      }
      l += ordered ? "</ol>" : "</ul>";
      html.push(l);
      continue;
    }

    const buf = [line.trim()];
    i++;
    while (
      i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^```/.test(lines[i]) &&
      !/^>\s?/.test(lines[i]) && !/^(\s*)([-*+]|\d+\.)\s+/.test(lines[i]) && !/^(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])
    ) { buf.push(lines[i].trim()); i++; }
    html.push(`<p>${mdRenderInline(buf.join(" "), ctx)}</p>`);
  }

  return html.join("\n");
}

function splitTableRow(line) {
  let l = line.trim();
  if (l.startsWith("|")) l = l.slice(1);
  if (l.endsWith("|")) l = l.slice(0, -1);
  return l.split("|").map((c) => c.trim());
}

/* ---------------------------------------------------------------------
   2) Parser YAML-ish minimo, solo para el formato de bloques ```chart
   (compatible con el plugin "obsidian-charts": type/labels/series/...).
--------------------------------------------------------------------- */

function parseChartYaml(text) {
  const rawLines = text.replace(/\r\n/g, "\n").split("\n").filter((l) => l.trim() !== "");
  let i = 0;
  const indentOf = (l) => l.match(/^ */)[0].length;

  function parseScalar(s) {
    s = s.trim();
    if (s === "" || s === "null" || s === "~") return null;
    if (s === "true") return true;
    if (s === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
    return s;
  }
  function splitTopLevelCommas(s) {
    const parts = [];
    let depth = 0, cur = "", inQ = false, qc = "";
    for (const ch of s) {
      if (inQ) { cur += ch; if (ch === qc) inQ = false; continue; }
      if (ch === '"' || ch === "'") { inQ = true; qc = ch; cur += ch; continue; }
      if (ch === "[") depth++;
      if (ch === "]") depth--;
      if (ch === "," && depth === 0) { parts.push(cur); cur = ""; continue; }
      cur += ch;
    }
    if (cur.trim() !== "") parts.push(cur);
    return parts.map((p) => p.trim());
  }
  function parseValue(s) {
    s = s.trim();
    if (s.startsWith("[") && s.endsWith("]")) return splitTopLevelCommas(s.slice(1, -1)).map(parseScalar);
    return parseScalar(s);
  }
  function parseBlock(minIndent) {
    const obj = {};
    while (i < rawLines.length) {
      const line = rawLines[i];
      const ind = indentOf(line);
      if (ind < minIndent) break;
      const trimmed = line.trim();
      if (trimmed.startsWith("- ")) break;
      const m = trimmed.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if (!m) { i++; continue; }
      const key = m[1], rest = m[2];
      i++;
      if (rest !== "") {
        obj[key] = parseValue(rest);
      } else if (i < rawLines.length && indentOf(rawLines[i]) > ind && rawLines[i].trim().startsWith("- ")) {
        obj[key] = parseList(ind + 1);
      } else if (i < rawLines.length && indentOf(rawLines[i]) > ind) {
        obj[key] = parseBlock(indentOf(rawLines[i]));
      } else {
        obj[key] = null;
      }
    }
    return obj;
  }
  function parseList(minIndent) {
    const arr = [];
    while (i < rawLines.length) {
      const line = rawLines[i];
      const ind = indentOf(line);
      if (ind < minIndent) break;
      const trimmed = line.trim();
      if (!trimmed.startsWith("- ")) break;
      const itemIndent = ind;
      const first = trimmed.slice(2);
      i++;
      const itemObj = {};
      const m = first.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if (m) itemObj[m[1]] = parseValue(m[2]);
      while (i < rawLines.length && indentOf(rawLines[i]) > itemIndent) {
        const m2 = rawLines[i].trim().match(/^([A-Za-z0-9_]+):\s*(.*)$/);
        if (m2) itemObj[m2[1]] = parseValue(m2[2]);
        i++;
      }
      arr.push(itemObj);
    }
    return arr;
  }
  return parseBlock(0);
}

function buildChartJsConfig(cfg) {
  const type = cfg.type || "line";
  const isCircular = type === "pie" || type === "doughnut" || type === "polarArea";
  const series = cfg.series || [];
  const datasets = series.map((s) => ({
    label: s.title || s.label || "",
    data: s.data || [],
    backgroundColor: s.backgroundColor,
    borderColor: s.borderColor,
    borderWidth: s.borderWidth !== undefined ? s.borderWidth : 2,
    fill: !!s.fill,
    tension: s.tension !== undefined ? s.tension : 0.3,
  }));
  return {
    type,
    data: { labels: cfg.labels || [], datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: cfg.legend !== false } },
      scales: isCircular ? {} : {
        y: { beginAtZero: !!cfg.beginAtZero, stacked: !!cfg.stacked },
        x: { stacked: !!cfg.stacked },
      },
    },
  };
}

/* ---------------------------------------------------------------------
   2b) Frontmatter (propiedades --- ... ---) y un "shim" minimo de la API
   de Obsidian (dv.*, app.vault/*, app.metadataCache, app.fileManager,
   app.workspace) para poder ejecutar, tal cual, los bloques ```dataviewjs
   que ya tienes en el vault (checklists, puntuacion, etc.) contra Drive
   en vez de contra el Obsidian de escritorio. Es un compatible parcial,
   pensado para los patrones que usan tus propias notas, no un Dataview
   completo.
--------------------------------------------------------------------- */

function parseFrontmatterBlock(content) {
  const m = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return { fm: {}, body: content };
  const fm = {};
  for (const line of m[1].split(/\r?\n/)) {
    if (!line.trim()) continue;
    const mm = line.match(/^([A-Za-z0-9_\-]+):\s*(.*)$/);
    if (mm) fm[mm[1]] = parseFmValue(mm[2]);
  }
  return { fm, body: content.slice(m[0].length) };
}
function parseFmScalar(s) {
  s = s.trim();
  if (s === "true") return true;
  if (s === "false") return false;
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
  return s;
}
function parseFmValue(s) {
  s = s.trim();
  if (s === "") return null;
  if (s.startsWith("[") && s.endsWith("]")) return s.slice(1, -1).split(",").map((x) => x.trim()).filter((x) => x !== "").map(parseFmScalar);
  return parseFmScalar(s);
}
function serializeFmScalar(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "boolean" || typeof v === "number") return String(v);
  const s = String(v);
  if (s !== "" && /^[A-Za-z0-9_.\-\/ áéíóúñÁÉÍÓÚÑ]*$/.test(s)) return s;
  return JSON.stringify(s);
}
function serializeFrontmatter(fm) {
  const lines = Object.keys(fm).map((k) => {
    const v = fm[k];
    return `${k}: ${Array.isArray(v) ? "[" + v.map(serializeFmScalar).join(", ") + "]" : serializeFmScalar(v)}`;
  });
  return "---\n" + lines.join("\n") + "\n---\n";
}

async function ensureDriveFolderPath(relFolder) {
  if (!relFolder) return rootFolder.id;
  const existing = filesByPath.get(relFolder);
  if (existing && existing.isFolder) return existing.id;
  const parts = relFolder.split("/");
  let parentId = rootFolder.id, acc = "";
  for (const part of parts) {
    acc = acc ? acc + "/" + part : part;
    const ex = filesByPath.get(acc);
    if (ex && ex.isFolder) { parentId = ex.id; continue; }
    // Puede que la carpeta ya exista en Drive pero no la tengamos cargada todavia (carga perezosa):
    // la buscamos antes de crear una duplicada.
    const found = (await driveSearchByName(part, true)).find((f) => f.mimeType === FOLDER_MIME && (f.parents || []).includes(parentId));
    if (found) {
      const parentPath = acc.includes("/") ? acc.slice(0, acc.lastIndexOf("/")) : "";
      addFileToIndexes(acc, found, parentPath);
      parentId = found.id;
      continue;
    }
    const created = await driveFetch(`${DRIVE_API}/files?fields=id`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: part, mimeType: FOLDER_MIME, parents: [parentId] }),
    }).then((r) => r.json());
    const parentPath = acc.includes("/") ? acc.slice(0, acc.lastIndexOf("/")) : "";
    filesByPath.set(acc, { id: created.id, name: part, mimeType: FOLDER_MIME, path: acc, parentPath, isFolder: true });
    if (!treeChildren.has(acc)) treeChildren.set(acc, []);
    if (!treeChildren.get(parentPath)) treeChildren.set(parentPath, []);
    if (!treeChildren.get(parentPath).includes(acc)) treeChildren.get(parentPath).push(acc);
    parentId = created.id;
  }
  return parentId;
}

// Resuelve una carpeta por su ruta completa, subiendo desde la raiz y buscando cada
// tramo con driveSearchByName si no esta ya cargado (evita tener que recorrer todo el vault).
async function resolveFolderPath(folderPath) {
  if (!folderPath || filesByPath.get(folderPath)) return filesByPath.get(folderPath) || null;
  const parts = folderPath.split("/");
  let parentId = rootFolder.id, acc = "";
  for (const part of parts) {
    acc = acc ? acc + "/" + part : part;
    let rec = filesByPath.get(acc);
    if (!rec) {
      const matches = await driveSearchByName(part, true);
      const found = matches.find((f) => f.mimeType === FOLDER_MIME && (f.parents || []).includes(parentId));
      if (!found) return null;
      const parentPath = acc.includes("/") ? acc.slice(0, acc.lastIndexOf("/")) : "";
      rec = addFileToIndexes(acc, found, parentPath);
    }
    parentId = rec.id;
  }
  return filesByPath.get(folderPath);
}

async function prefetchForScript(code) {
  const folders = new Set();
  const re = /"([^"]*\/[^"]*)"/g;
  let m;
  while ((m = re.exec(code))) folders.add(m[1]);

  for (const folder of folders) {
    const rec = await resolveFolderPath(folder);
    if (rec && rec.isFolder) await fetchFolderChildren(folder);
  }

  const paths = new Set();
  for (const folder of folders) {
    for (const f of filesByPath.values()) {
      if (f.isFolder || !f.path.toLowerCase().endsWith(".md")) continue;
      if (f.path === folder || f.path.startsWith(folder + "/")) paths.add(f.path);
    }
  }
  await Promise.all([...paths].map(async (p) => {
    if (frontmatterCache.has(p)) return;
    const file = filesByPath.get(p);
    try {
      // Si ya tenemos el contenido completo (se abrio como nota, o cache de una sesion anterior), lo usamos.
      const fullCached = contentCache.get(p) ?? (await idbGet("content", file.id));
      if (fullCached !== undefined) {
        contentCache.set(p, fullCached);
        frontmatterCache.set(p, parseFrontmatterBlock(fullCached).fm);
        return;
      }
      const fmCached = await idbGet("fm", file.id);
      if (fmCached !== undefined) { frontmatterCache.set(p, fmCached); return; }

      const { text, complete } = await fetchFrontmatterOnly(file.id);
      if (complete) {
        const fm = parseFrontmatterBlock(text).fm;
        frontmatterCache.set(p, fm);
        idbSet("fm", file.id, fm);
      } else {
        const content = await downloadText(file.id);
        contentCache.set(p, content);
        idbSet("content", file.id, content);
        frontmatterCache.set(p, parseFrontmatterBlock(content).fm);
      }
    } catch (e) { /* si un archivo falla, seguimos con el resto */ }
  }));
}

function makeDvArray(arr) {
  arr.where = (fn) => makeDvArray(arr.filter(fn));
  arr.array = () => arr.slice();
  return arr;
}

function makeDvShim(holder) {
  return {
    el(tag, text, opts) {
      const e = document.createElement(tag);
      if (text) e.textContent = text;
      if (opts && opts.cls) e.className = opts.cls;
      holder.appendChild(e);
      return e;
    },
    pages(source) {
      let folder = String(source || "").trim();
      const qm = folder.match(/^"(.*)"$/);
      if (qm) folder = qm[1];
      const arr = [];
      for (const f of filesByPath.values()) {
        if (f.isFolder || !f.path.toLowerCase().endsWith(".md")) continue;
        if (f.path !== folder && !f.path.startsWith(folder + "/")) continue;
        const fm = frontmatterCache.get(f.path) || {};
        arr.push(Object.assign({}, fm, { file: { name: f.name.replace(/\.md$/i, ""), path: f.path } }));
      }
      return makeDvArray(arr);
    },
  };
}

function makeAppShim() {
  return {
    vault: {
      getAbstractFileByPath(path) {
        const f = filesByPath.get(path);
        return f ? { path: f.path, name: f.name, id: f.id } : null;
      },
      async create(path, content) {
        const relFolder = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
        const folderId = await ensureDriveFolderPath(relFolder);
        const name = path.slice(path.lastIndexOf("/") + 1);
        const created = await driveFetch(`${DRIVE_API}/files?fields=id`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, parents: [folderId] }),
        }).then((r) => r.json());
        await uploadText(created.id, content);
        const fileRec = { id: created.id, name, mimeType: "text/markdown", modifiedTime: new Date().toISOString(), path, parentPath: relFolder, isFolder: false };
        filesByPath.set(path, fileRec);
        if (!treeChildren.has(relFolder)) treeChildren.set(relFolder, []);
        treeChildren.get(relFolder).push(path);
        const base = name.replace(/\.[^.]+$/, "").toLowerCase();
        if (!nameIndex.has(base)) nameIndex.set(base, path);
        contentCache.set(path, content);
        frontmatterCache.set(path, parseFrontmatterBlock(content).fm);
        renderTree();
        return fileRec;
      },
      async read(file) {
        if (contentCache.has(file.path)) return contentCache.get(file.path);
        const c = await downloadText(file.id);
        contentCache.set(file.path, c);
        return c;
      },
      async modify(file, content) {
        await uploadText(file.id, content);
        contentCache.set(file.path, content);
      },
    },
    metadataCache: {
      getFileCache(file) { return { frontmatter: frontmatterCache.get(file.path) || {} }; },
    },
    fileManager: {
      async processFrontMatter(file, fn) {
        let content = contentCache.get(file.path);
        if (content === undefined) { content = await downloadText(file.id); contentCache.set(file.path, content); }
        const parsed = parseFrontmatterBlock(content);
        fn(parsed.fm);
        const newContent = serializeFrontmatter(parsed.fm) + parsed.body;
        await uploadText(file.id, newContent);
        contentCache.set(file.path, newContent);
        frontmatterCache.set(file.path, parsed.fm);
      },
    },
    workspace: {
      openLinkText(linkText) {
        const target = String(linkText).split("|")[0].split("#")[0].trim();
        let path = nameIndex.get(target.toLowerCase());
        if (!path && filesByPath.has(target)) path = target;
        if (!path) { toast("No se encontro: " + linkText, true); return; }
        closeSidebar();
        if (path.toLowerCase().endsWith(".md")) openNote(path); else openOther(path);
      },
    },
  };
}

function timeoutAfter(ms, label) {
  return new Promise((_, reject) => setTimeout(() => reject(new Error(label + " tardo demasiado (>" + Math.round(ms / 1000) + "s)")), ms));
}

async function runDataviewJs(code, holderId) {
  const holder = document.getElementById(holderId);
  if (!holder) return;
  try {
    await Promise.race([prefetchForScript(code), timeoutAfter(20000, "La preparacion del bloque")]);
    const dvShim = makeDvShim(holder);
    const appShim = makeAppShim();
    const fn = new Function("dv", "app", "return (async () => {\n" + code + "\n})()");
    await Promise.race([fn(dvShim, appShim), timeoutAfter(20000, "El bloque interactivo")]);
  } catch (e) {
    console.error("dataviewjs error", e);
    holder.innerHTML = "";
    holder.appendChild(el("div", { class: "empty", text: "No se pudo ejecutar este bloque interactivo: " + e.message }));
  }
}

/* ---------------------------------------------------------------------
   Cache local (IndexedDB): el arbol del vault y el texto de las notas se
   guardan en el propio dispositivo. Al abrir la app se pinta todo al
   instante desde esta cache, y Drive solo se consulta de fondo para
   traer cambios (no bloquea nada).
--------------------------------------------------------------------- */
const IDB_NAME = "ovd_cache_v2";
let idbPromise = null;

function idbOpen() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { resolve(null); return; }
    const req = indexedDB.open(IDB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("tree")) db.createObjectStore("tree");
      if (!db.objectStoreNames.contains("content")) db.createObjectStore("content");
      if (!db.objectStoreNames.contains("loaded")) db.createObjectStore("loaded");
      if (!db.objectStoreNames.contains("fm")) db.createObjectStore("fm");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
  return idbPromise;
}
async function idbGet(store, key) {
  const db = await idbOpen();
  if (!db) return undefined;
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readonly").objectStore(store).get(key);
    tx.onsuccess = () => resolve(tx.result);
    tx.onerror = () => resolve(undefined);
  });
}
async function idbSet(store, key, value) {
  const db = await idbOpen();
  if (!db) return;
  return new Promise((resolve) => {
    const tx = db.transaction(store, "readwrite").objectStore(store).put(value, key);
    tx.onsuccess = () => resolve();
    tx.onerror = () => resolve();
  });
}
async function idbGetAll(store) {
  const db = await idbOpen();
  if (!db) return [];
  return new Promise((resolve) => {
    const os = db.transaction(store, "readonly").objectStore(store);
    const keysReq = os.getAllKeys();
    const valsReq = os.getAll();
    keysReq.onsuccess = () => {
      valsReq.onsuccess = () => resolve(keysReq.result.map((k, i) => [k, valsReq.result[i]]));
      valsReq.onerror = () => resolve([]);
    };
    keysReq.onerror = () => resolve([]);
  });
}
async function idbClearAll() {
  const db = await idbOpen();
  if (!db) return;
  return new Promise((resolve) => {
    const tx = db.transaction(["tree", "content", "loaded", "fm"], "readwrite");
    tx.objectStore("tree").clear();
    tx.objectStore("content").clear();
    tx.objectStore("loaded").clear();
    tx.objectStore("fm").clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

async function driveFetch(url, opts) {
  opts = opts || {};
  const res = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + accessToken, ...(opts.headers || {}) } });
  if (res.status === 401) { revokeToken(); showLogin("Tu sesion caduco, inicia sesion de nuevo."); throw new Error("sesion caducada"); }
  if (!res.ok) { const text = await res.text().catch(() => ""); throw new Error("Drive API " + res.status + (text ? ": " + text.slice(0, 200) : "")); }
  return res;
}

async function listChildrenOf(folderId) {
  const out = [];
  let pageToken;
  do {
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const params = `q=${q}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&pageSize=1000` + (pageToken ? `&pageToken=${pageToken}` : "");
    const res = await driveFetch(`${DRIVE_API}/files?${params}`);
    const data = await res.json();
    out.push(...(data.files || []));
    pageToken = data.nextPageToken;
  } while (pageToken);
  return out;
}

function addFileToIndexes(childPath, child, parentPath) {
  const isFolder = child.mimeType === FOLDER_MIME;
  const rec = { id: child.id, name: child.name, mimeType: child.mimeType, modifiedTime: child.modifiedTime, path: childPath, parentPath, isFolder };
  filesByPath.set(childPath, rec);
  if (!treeChildren.has(parentPath)) treeChildren.set(parentPath, []);
  if (!treeChildren.get(parentPath).includes(childPath)) treeChildren.get(parentPath).push(childPath);
  if (isFolder && !treeChildren.has(childPath)) treeChildren.set(childPath, []);
  if (!isFolder && childPath.toLowerCase().endsWith(".md")) {
    const base = child.name.replace(/\.[^.]+$/, "").toLowerCase();
    if (!nameIndex.has(base)) nameIndex.set(base, childPath);
  }
  idbSet("tree", childPath, rec);
  return rec;
}

async function fetchFolderChildren(path) {
  if (loadedFolders.has(path)) return;
  const folderId = path === "" ? rootFolder.id : filesByPath.get(path).id;
  const children = await listChildrenOf(folderId);
  children.sort((a, b) => {
    const af = a.mimeType === FOLDER_MIME ? 0 : 1, bf = b.mimeType === FOLDER_MIME ? 0 : 1;
    if (af !== bf) return af - bf;
    return a.name.localeCompare(b.name, "es");
  });
  if (!treeChildren.has(path)) treeChildren.set(path, []);
  for (const child of children) {
    const childPath = path ? path + "/" + child.name : child.name;
    addFileToIndexes(childPath, child, path);
  }
  loadedFolders.add(path);
  idbSet("loaded", path, true);
}

// Busca un archivo por nombre directamente en Drive (sin recorrer carpeta por carpeta).
// Funciona porque el Picker ya te dio acceso a toda la subcarpeta elegida, no solo a la carpeta en si.
async function driveSearchByName(nameContains, exact) {
  const safe = nameContains.replace(/'/g, "\\'");
  const q = exact ? `name = '${safe}' and trashed=false` : `name contains '${safe}' and trashed=false`;
  const params = `q=${encodeURIComponent(q)}&fields=files(id,name,mimeType,modifiedTime,parents)&pageSize=25`;
  const res = await driveFetch(`${DRIVE_API}/files?${params}`);
  const data = await res.json();
  return data.files || [];
}

// Reconstruye la ruta completa (carpeta1/carpeta2/nombre.md) de un archivo encontrado por busqueda,
// subiendo por sus carpetas padre hasta llegar a la raiz del vault.
async function resolveFilePath(file) {
  const segments = [file.name];
  let parentId = (file.parents || [])[0];
  let guard = 0;
  while (parentId && parentId !== rootFolder.id && guard++ < 12) {
    const res = await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(parentId)}?fields=id,name,parents`);
    const parent = await res.json();
    segments.unshift(parent.name);
    parentId = (parent.parents || [])[0];
  }
  const path = segments.join("/");
  const parentPath = segments.slice(0, -1).join("/");
  addFileToIndexes(path, file, parentPath);
  return path;
}

async function downloadText(fileId) { const res = await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`); return res.text(); }

// Trae solo los primeros bytes de un archivo (las propiedades --- --- siempre van al principio).
// Mucho mas ligero que bajar la nota entera cuando solo hace falta leer su frontmatter.
async function fetchFrontmatterOnly(fileId) {
  const res = await fetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`, {
    headers: { Authorization: "Bearer " + accessToken, Range: "bytes=0-2047" },
  });
  if (res.status === 401) { revokeToken(); showLogin("Tu sesion caduco, inicia sesion de nuevo."); throw new Error("sesion caducada"); }
  if (!res.ok && res.status !== 206) throw new Error("Drive API " + res.status);
  const text = await res.text();
  const complete = res.status !== 206 || /\r?\n---\r?\n/.test(text.slice(3));
  return { text, complete };
}
async function downloadBlob(fileId) { const res = await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(fileId)}?alt=media`); return res.blob(); }
async function uploadText(fileId, text) {
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media`, {
    method: "PATCH", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: text,
  });
}

async function loadVault() {
  const [cachedEntries, cachedLoaded] = await Promise.all([idbGetAll("tree"), idbGetAll("loaded")]);
  const showedCached = cachedEntries.length > 0;

  filesByPath = new Map(); treeChildren = new Map(); treeChildren.set("", []); nameIndex = new Map();
  loadedFolders = new Set();

  if (showedCached) {
    for (const [path, rec] of cachedEntries) {
      filesByPath.set(path, rec);
      if (!treeChildren.has(rec.parentPath)) treeChildren.set(rec.parentPath, []);
      if (!treeChildren.get(rec.parentPath).includes(path)) treeChildren.get(rec.parentPath).push(path);
      if (rec.isFolder && !treeChildren.has(path)) treeChildren.set(path, []);
      if (!rec.isFolder && path.toLowerCase().endsWith(".md")) {
        const base = rec.name.replace(/\.[^.]+$/, "").toLowerCase();
        if (!nameIndex.has(base)) nameIndex.set(base, path);
      }
    }
    for (const [path] of cachedLoaded) loadedFolders.add(path);
    for (const [, children] of treeChildren) {
      children.sort((a, b) => {
        const fa = filesByPath.get(a), fb = filesByPath.get(b);
        const af = fa.isFolder ? 0 : 1, bf = fb.isFolder ? 0 : 1;
        if (af !== bf) return af - bf;
        return fa.name.localeCompare(fb.name, "es");
      });
    }
  } else {
    showLoading("Leyendo tu vault...");
  }

  try {
    await fetchFolderChildren(""); // solo el nivel raiz: rapido, el resto se carga al desplegar cada carpeta
  } catch (e) {
    if (!showedCached) {
      main.innerHTML = "";
      main.appendChild(el("div", { class: "empty", text: "Error leyendo el vault: " + e.message }));
      return;
    }
    toast("No se pudo actualizar la carpeta raiz desde Drive: " + e.message, true);
  }

  vaultNameEl.textContent = rootFolder.name;
  $("sidebarEmail").textContent = currentUserEmail || "";
  renderTree();
  if (!showedCached) {
    tabs = []; activeTab = -1;
    renderTabBar();
    main.innerHTML = "";
    topbarActions.innerHTML = "";
    const wrap = el("div", { class: "center-screen" });
    wrap.appendChild(el("p", { text: "Selecciona una nota del menu para empezar." }));
    main.appendChild(wrap);
  }
}

function renderTree() {
  treeEl.innerHTML = "";
  for (const path of treeChildren.get("") || []) treeEl.appendChild(buildTreeNode(path));
}

function buildTreeNode(path) {
  const file = filesByPath.get(path);
  const item = el("div", { class: "tree-item" });
  const row = el("div", { class: "tree-row" });

  if (file.isFolder) {
    const expanded = expandedFolders.has(path);
    row.classList.toggle("collapsed", !expanded);
    row.appendChild(el("span", { class: "chev", text: "▾" }));
    row.appendChild(el("span", { class: "name", text: "📁 " + file.name }));
    const childrenWrap = el("div", { class: "tree-children" + (expanded ? "" : " hidden") });
    item.appendChild(row); item.appendChild(childrenWrap);

    let built = false;
    async function ensureChildren() {
      if (built) return;
      built = true;
      if (!loadedFolders.has(path)) {
        const spinner = el("div", { class: "empty", text: "Cargando..." });
        spinner.style.padding = "6px 8px";
        childrenWrap.appendChild(spinner);
        try {
          await fetchFolderChildren(path);
        } catch (e) {
          spinner.textContent = "Error: " + e.message;
          return;
        }
        childrenWrap.removeChild(spinner);
      }
      for (const childPath of treeChildren.get(path) || []) childrenWrap.appendChild(buildTreeNode(childPath));
    }

    if (expanded) ensureChildren();

    row.addEventListener("click", async () => {
      const isHidden = childrenWrap.classList.contains("hidden");
      if (isHidden) {
        row.classList.remove("collapsed");
        childrenWrap.classList.remove("hidden");
        expandedFolders.add(path);
        await ensureChildren();
      } else {
        childrenWrap.classList.add("hidden");
        row.classList.add("collapsed");
        expandedFolders.delete(path);
      }
    });
  } else {
    const isMd = file.name.toLowerCase().endsWith(".md");
    const icon = isMd ? "📄" : /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name) ? "🖼️" : "📎";
    row.appendChild(el("span", { class: "chev", text: "" }));
    row.appendChild(el("span", { class: "name", text: icon + " " + file.name.replace(/\.md$/i, "") }));
    row.addEventListener("click", () => { closeSidebar(); if (isMd) openNote(path); else openOther(path); });
    item.appendChild(row);
  }
  attachContextMenu(row, path);
  return item;
}

/* ---------------- Menu contextual (mantener pulsado / clic derecho) ---------------- */

function attachContextMenu(row, path) {
  row.addEventListener("contextmenu", (ev) => { ev.preventDefault(); openContextMenu(path, ev.clientX, ev.clientY); });
  let pressTimer = null, longPressed = false, startX = 0, startY = 0;
  row.addEventListener("touchstart", (ev) => {
    longPressed = false;
    const t = ev.touches[0];
    startX = t.clientX; startY = t.clientY;
    pressTimer = setTimeout(() => {
      longPressed = true;
      if (navigator.vibrate) navigator.vibrate(15);
      openContextMenu(path, startX, startY);
    }, 550);
  }, { passive: true });
  row.addEventListener("touchmove", (ev) => {
    const t = ev.touches[0];
    if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) clearTimeout(pressTimer);
  }, { passive: true });
  row.addEventListener("touchend", () => { clearTimeout(pressTimer); }, { passive: true });
  row.addEventListener("click", (ev) => { if (longPressed) { ev.stopPropagation(); ev.preventDefault(); longPressed = false; } }, true);
}

function closeContextMenu() {
  document.querySelectorAll(".ctx-menu, .ctx-menu-scrim").forEach((n) => n.remove());
}

function openContextMenu(path, x, y) {
  closeContextMenu();
  const file = filesByPath.get(path);
  if (!file) return;

  const scrim = el("div", { class: "ctx-menu-scrim", onclick: closeContextMenu });
  document.body.appendChild(scrim);

  const menu = el("div", { class: "ctx-menu" });
  const actions = [];
  if (file.isFolder) {
    actions.push(["📝 Nueva nota aqui", () => { closeContextMenu(); createNote(path); }]);
    actions.push(["📁 Nueva subcarpeta", () => { closeContextMenu(); createFolder(path); }]);
  }
  actions.push(["✏️ Renombrar", () => { closeContextMenu(); renameItem(path); }]);
  actions.push(["🗑️ Eliminar", () => { closeContextMenu(); deleteItem(path); }]);

  for (const [label, handler] of actions) menu.appendChild(el("button", { text: label, onclick: handler }));
  document.body.appendChild(menu);

  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  menu.style.left = Math.max(8, Math.min(x, maxX)) + "px";
  menu.style.top = Math.max(8, Math.min(y, maxY)) + "px";
}

/* ---------------- Crear / renombrar / borrar ---------------- */

function removeLocalPath(path) {
  const file = filesByPath.get(path);
  if (!file) return;
  if (file.isFolder) {
    for (const childPath of (treeChildren.get(path) || []).slice()) removeLocalPath(childPath);
    treeChildren.delete(path);
    loadedFolders.delete(path);
  }
  filesByPath.delete(path);
  const siblings = treeChildren.get(file.parentPath);
  if (siblings) { const i = siblings.indexOf(path); if (i !== -1) siblings.splice(i, 1); }
  for (const [name, p] of nameIndex) if (p === path) nameIndex.delete(name);
  contentCache.delete(path); frontmatterCache.delete(path);
  idbOpen().then((db) => {
    if (!db) return;
    const tx = db.transaction(["tree", "content", "loaded", "fm"], "readwrite");
    tx.objectStore("tree").delete(path);
    tx.objectStore("content").delete(file.id);
    tx.objectStore("loaded").delete(path);
    tx.objectStore("fm").delete(file.id);
  });
  const openIdx = tabs.findIndex((t) => t.path === path);
  if (openIdx !== -1) closeTab(openIdx);
}

async function createNote(parentPath) {
  const name = prompt("Nombre de la nueva nota:", "Nueva nota");
  if (!name) return;
  const fileName = name.toLowerCase().endsWith(".md") ? name : name + ".md";
  const path = parentPath ? parentPath + "/" + fileName : fileName;
  if (filesByPath.has(path)) { toast("Ya existe una nota con ese nombre aqui.", true); return; }
  try {
    const folderId = await ensureDriveFolderPath(parentPath);
    const created = await driveFetch(`${DRIVE_API}/files?fields=id`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: fileName, parents: [folderId] }),
    }).then((r) => r.json());
    await uploadText(created.id, "");
    addFileToIndexes(path, { id: created.id, name: fileName, mimeType: "text/markdown", modifiedTime: new Date().toISOString() }, parentPath);
    contentCache.set(path, ""); idbSet("content", created.id, "");
    if (!loadedFolders.has(parentPath)) { loadedFolders.add(parentPath); idbSet("loaded", parentPath, true); }
    expandedFolders.add(parentPath);
    renderTree();
    openNote(path);
  } catch (e) { toast("No se pudo crear la nota: " + e.message, true); }
}

async function createFolder(parentPath) {
  const name = prompt("Nombre de la nueva carpeta:");
  if (!name) return;
  const path = parentPath ? parentPath + "/" + name : name;
  if (filesByPath.has(path)) { toast("Ya existe una carpeta con ese nombre aqui.", true); return; }
  try {
    const parentId = await ensureDriveFolderPath(parentPath);
    const created = await driveFetch(`${DRIVE_API}/files?fields=id`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, mimeType: FOLDER_MIME, parents: [parentId] }),
    }).then((r) => r.json());
    addFileToIndexes(path, { id: created.id, name, mimeType: FOLDER_MIME, modifiedTime: new Date().toISOString() }, parentPath);
    loadedFolders.add(path); idbSet("loaded", path, true);
    if (!loadedFolders.has(parentPath)) { loadedFolders.add(parentPath); idbSet("loaded", parentPath, true); }
    expandedFolders.add(parentPath);
    renderTree();
  } catch (e) { toast("No se pudo crear la carpeta: " + e.message, true); }
}

// Devuelve las rutas de todos los descendientes ya cargados de una carpeta (orden de arriba a abajo).
function collectDescendants(path) {
  const out = [];
  for (const childPath of treeChildren.get(path) || []) {
    out.push(childPath);
    const rec = filesByPath.get(childPath);
    if (rec && rec.isFolder) out.push(...collectDescendants(childPath));
  }
  return out;
}

// Mueve un unico nodo ya indexado de oldPath a newPath, conservando su cache y su pestana abierta si la tiene.
function moveSingleNode(oldPath, newPath) {
  const rec = filesByPath.get(oldPath);
  if (!rec) return;
  const oldSiblings = treeChildren.get(rec.parentPath);
  if (oldSiblings) { const i = oldSiblings.indexOf(oldPath); if (i !== -1) oldSiblings.splice(i, 1); }
  filesByPath.delete(oldPath);
  const wasLoaded = loadedFolders.has(oldPath);
  if (rec.isFolder) loadedFolders.delete(oldPath);
  const cachedContent = contentCache.get(oldPath);
  const cachedFm = frontmatterCache.get(oldPath);
  contentCache.delete(oldPath); frontmatterCache.delete(oldPath);
  for (const [n, p] of nameIndex) if (p === oldPath) nameIndex.delete(n);
  idbOpen().then((db) => {
    if (!db) return;
    const tx = db.transaction(["tree", "loaded"], "readwrite");
    tx.objectStore("tree").delete(oldPath);
    tx.objectStore("loaded").delete(oldPath);
  });

  const newParentPath = newPath.includes("/") ? newPath.slice(0, newPath.lastIndexOf("/")) : "";
  addFileToIndexes(newPath, rec, newParentPath);
  if (rec.isFolder && wasLoaded) { loadedFolders.add(newPath); idbSet("loaded", newPath, true); }
  if (cachedContent !== undefined) { contentCache.set(newPath, cachedContent); idbSet("content", rec.id, cachedContent); }
  if (cachedFm !== undefined) frontmatterCache.set(newPath, cachedFm);
  const tab = tabs.find((t) => t.path === oldPath);
  if (tab) tab.path = newPath;
}

async function renameItem(path) {
  const file = filesByPath.get(path);
  const currentLabel = file.isFolder ? file.name : file.name.replace(/\.md$/i, "");
  const input = prompt("Nuevo nombre:", currentLabel);
  if (!input || input === currentLabel) return;
  const newName = !file.isFolder && !input.toLowerCase().endsWith(".md") ? input + ".md" : input;
  const newPath = file.parentPath ? file.parentPath + "/" + newName : newName;
  if (filesByPath.has(newPath)) { toast("Ya existe algo con ese nombre ahi.", true); return; }
  try {
    await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(file.id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: newName }),
    });
    // Recoger los descendientes ANTES de tocar nada, para no perderlos al mover la carpeta.
    const descendantPaths = file.isFolder ? collectDescendants(path) : [];
    moveSingleNode(path, newPath);
    filesByPath.get(newPath).name = newName;
    for (const oldChildPath of descendantPaths) {
      const newChildPath = newPath + oldChildPath.slice(path.length);
      moveSingleNode(oldChildPath, newChildPath);
    }
    renderTree();
    renderTabBar();
    if (activeTab !== -1 && tabs[activeTab] && tabs[activeTab].path === newPath) renderNote();
  } catch (e) { toast("No se pudo renombrar: " + e.message, true); }
}

async function deleteItem(path) {
  const file = filesByPath.get(path);
  const label = file.isFolder ? "la carpeta y todo lo que contiene" : "la nota";
  if (!confirm(`¿Eliminar ${label} "${file.name}"? Se movera a la papelera de Google Drive (se puede recuperar desde ahi).`)) return;
  try {
    await driveFetch(`${DRIVE_API}/files/${encodeURIComponent(file.id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }),
    });
    removeLocalPath(path);
    renderTree();
    if (activeTab === -1) {
      main.innerHTML = "";
      const wrap = el("div", { class: "center-screen" });
      wrap.appendChild(el("p", { text: "Selecciona una nota del menu para empezar." }));
      main.appendChild(wrap);
    }
    toast("Eliminado (en la papelera de Drive).");
  } catch (e) { toast("No se pudo eliminar: " + e.message, true); }
}

/* ---------------- Pestanas (tabs) ---------------- */

function renderTabBar() {
  tabbarEl.innerHTML = "";
  tabs.forEach((tab, idx) => {
    const file = filesByPath.get(tab.path);
    const pill = el("div", { class: "tab" + (idx === activeTab ? " active" : "") + (tab.dirty ? " dirty" : "") });
    const name = el("span", { class: "tab-name", text: file ? file.name.replace(/\.md$/i, "") : tab.path });
    const close = el("span", { class: "tab-close", text: "✕" });
    pill.appendChild(name);
    pill.appendChild(close);
    pill.addEventListener("click", (ev) => { if (ev.target === close) return; setActiveTab(idx); });
    close.addEventListener("click", (ev) => { ev.stopPropagation(); closeTab(idx); });
    tabbarEl.appendChild(pill);
  });
}

function setActiveTab(idx) { activeTab = idx; renderTabBar(); renderNote(); }

function closeTab(idx) {
  tabs.splice(idx, 1);
  if (tabs.length === 0) { activeTab = -1; }
  else if (activeTab > idx) { activeTab--; }
  else if (activeTab === idx) { activeTab = Math.min(idx, tabs.length - 1); }
  renderTabBar();
  if (activeTab === -1) {
    topbarActions.innerHTML = "";
    const wrap = el("div", { class: "center-screen" });
    wrap.appendChild(el("p", { text: "Selecciona una nota del menu para empezar." }));
    main.innerHTML = ""; main.appendChild(wrap);
  } else {
    renderNote();
  }
}

/* ---------------- Abrir notas / archivos ---------------- */

async function openNote(path) {
  const existingIdx = tabs.findIndex((t) => t.path === path);
  if (existingIdx !== -1) { setActiveTab(existingIdx); return; }
  const file = filesByPath.get(path);
  if (!file) { toast("Nota no encontrada: " + path, true); return; }

  const cached = await idbGet("content", file.id);
  if (cached !== undefined) {
    // Apertura instantanea desde la cache local; Drive se consulta de fondo.
    contentCache.set(path, cached);
    const tab = { path, id: file.id, content: cached, dirty: false, viewMode: "preview" };
    tabs.push(tab);
    activeTab = tabs.length - 1;
    renderTabBar();
    renderNote();
    refreshNoteInBackground(tab, file);
    return;
  }

  showLoading("Abriendo " + file.name + "...");
  try {
    const content = await downloadText(file.id);
    contentCache.set(path, content);
    idbSet("content", file.id, content);
    tabs.push({ path, id: file.id, content, dirty: false, viewMode: "preview" });
    activeTab = tabs.length - 1;
    renderTabBar();
    renderNote();
  } catch (e) {
    main.innerHTML = "";
    main.appendChild(el("div", { class: "empty", text: "Error abriendo la nota: " + e.message }));
  }
}

async function refreshNoteInBackground(tab, file) {
  try {
    const fresh = await downloadText(file.id);
    idbSet("content", file.id, fresh);
    if (fresh === tab.content) return;
    if (tab.dirty) return; // no pisar ediciones sin guardar
    tab.content = fresh;
    contentCache.set(tab.path, fresh);
    if (tabs[activeTab] === tab) renderNote();
  } catch (e) { /* sin conexion o error puntual: seguimos con lo que ya se ve */ }
}

async function openOther(path) {
  const file = filesByPath.get(path);
  const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name);
  topbarActions.innerHTML = "";
  if (isImg) {
    showLoading("Cargando imagen...");
    try {
      const blob = await downloadBlob(file.id);
      const url = URL.createObjectURL(blob);
      main.innerHTML = "";
      const wrap = el("div", { class: "center-screen" });
      const img = document.createElement("img");
      img.src = url; img.style.maxWidth = "100%"; img.style.borderRadius = "8px";
      wrap.appendChild(img);
      main.appendChild(wrap);
    } catch (e) {
      main.innerHTML = "";
      main.appendChild(el("div", { class: "empty", text: "Error cargando la imagen: " + e.message }));
    }
  } else {
    main.innerHTML = "";
    const wrap = el("div", { class: "center-screen" });
    wrap.appendChild(el("p", { text: "Este tipo de archivo no se puede previsualizar aqui." }));
    const link = el("a", { text: "Abrir en Google Drive" });
    link.href = `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`;
    link.target = "_blank"; link.rel = "noopener noreferrer";
    wrap.appendChild(link);
    main.appendChild(wrap);
  }
}

/* ---------------- Render de la nota activa ---------------- */

function destroyCharts() {
  for (const c of chartInstances) { try { c.destroy(); } catch (e) {} }
  chartInstances = [];
}

function renderNote() {
  destroyCharts();
  if (activeTab === -1 || !tabs[activeTab]) return;
  const tab = tabs[activeTab];
  const file = filesByPath.get(tab.path);

  topbarActions.innerHTML = "";
  if (tab.viewMode === "preview") {
    topbarActions.appendChild(el("button", { class: "icon-btn", title: "Editar", text: "✏️", onclick: () => { tab.viewMode = "edit"; renderNote(); } }));
  } else {
    topbarActions.appendChild(el("button", { class: "icon-btn", title: "Vista previa", text: "👁️", onclick: () => { tab.viewMode = "preview"; renderNote(); } }));
    const saveBtn = el("button", { class: "pill primary", text: "Guardar", onclick: () => saveTab(tab, saveBtn) });
    saveBtn.disabled = !tab.dirty;
    topbarActions.appendChild(saveBtn);
  }

  main.innerHTML = "";
  const wrap = el("div", { class: "note-wrap" });

  if (tab.viewMode === "edit") {
    const textarea = document.createElement("textarea");
    textarea.value = tab.content;
    textarea.addEventListener("input", () => {
      tab.content = textarea.value; tab.dirty = true;
      renderTabBar();
      const saveBtn = topbarActions.querySelector("button.primary");
      if (saveBtn) saveBtn.disabled = false;
    });
    wrap.appendChild(textarea);
  } else {
    const div = el("div", { class: "md" });
    const pendingImages = [];
    const pendingCharts = [];
    const pendingScripts = [];
    const pendingLinks = [];
    let counter = 0;
    const ctx = {
      onWikilink: (target, alias) => renderWikilink(target, alias, pendingLinks, () => counter++),
      onEmbed: (target, alias) => renderEmbed(target, alias, pendingImages, () => counter++),
      onImage: (url, alt) => renderInlineImage(url, alt, pendingImages, () => counter++, tab.path),
      onChart: (yamlText) => renderChartPlaceholder(yamlText, pendingCharts, () => counter++),
      onDataviewJs: (code) => renderDataviewJsPlaceholder(code, pendingScripts, () => counter++),
    };
    div.innerHTML = renderMarkdown(tab.content, ctx);
    wrap.appendChild(div);

    div.addEventListener("click", (ev) => {
      const a = ev.target.closest("a[data-open]");
      if (a) { ev.preventDefault(); openNote(a.getAttribute("data-open")); }
    });
    div.addEventListener("change", (ev) => {
      const cb = ev.target.closest('input[type="checkbox"][data-line]');
      if (cb) toggleCheckboxLine(tab, Number(cb.getAttribute("data-line")), cb.checked);
    });

    resolvePendingImages(pendingImages);
    resolvePendingCharts(pendingCharts);
    resolvePendingLinks(pendingLinks);
    for (const p of pendingScripts) runDataviewJs(p.code, p.holderId);
  }

  main.appendChild(wrap);
}

function renderWikilink(target, alias, pendingLinks, nextId) {
  const path = nameIndex.get(target.toLowerCase());
  const label = mdEscapeHtml(alias || target);
  if (path) return `<a href="#" class="wikilink" data-open="${mdEscapeHtml(path)}">${label}</a>`;
  const linkId = "wl-" + nextId();
  pendingLinks.push({ linkId, target });
  return `<a href="#" class="wikilink broken" id="${linkId}" title="Buscando...">${label}</a>`;
}

// Los enlaces que no estaban ya cargados se resuelven de fondo con una busqueda directa
// en Drive (rapido: no hace falta recorrer todas las carpetas del vault).
async function resolvePendingLinks(pending) {
  for (const p of pending) {
    try {
      const already = nameIndex.get(p.target.toLowerCase());
      let path = already;
      if (!path) {
        const matches = await driveSearchByName(p.target + ".md", true);
        if (matches.length > 0) path = await resolveFilePath(matches[0]);
      }
      const a = document.getElementById(p.linkId);
      if (!a) continue;
      if (path) {
        a.classList.remove("broken");
        a.setAttribute("data-open", path);
        a.title = "";
      } else {
        a.title = "Nota no encontrada";
      }
    } catch (e) { /* si falla la busqueda, el enlace se queda marcado como no encontrado */ }
  }
}

function renderEmbed(target, alias, pendingImages, nextId) {
  const path = nameIndex.get(target.toLowerCase()) || (filesByPath.has(target) ? target : null);
  if (!path) return `<span class="embed-missing">[[${mdEscapeHtml(target)}]] no encontrada</span>`;
  const file = filesByPath.get(path);
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)) {
    const holderId = "embed-img-" + nextId();
    pendingImages.push({ holderId, fileId: file.id });
    return `<span class="embed-missing" id="${holderId}">Cargando ${mdEscapeHtml(file.name)}...</span>`;
  }
  const label = mdEscapeHtml(alias || file.name.replace(/\.md$/i, ""));
  return `<a href="#" class="wikilink" data-open="${mdEscapeHtml(path)}">🔗 ${label}</a>`;
}

function renderInlineImage(url, alt, pendingImages, nextId, currentPath) {
  const decoded = decodeURIComponent(url);
  let file = filesByPath.get(decoded);
  if (!file) {
    const baseDir = currentPath.includes("/") ? currentPath.slice(0, currentPath.lastIndexOf("/")) : "";
    file = filesByPath.get(baseDir ? baseDir + "/" + decoded : decoded);
  }
  if (!file) {
    const base = decoded.split("/").pop().replace(/\.[^.]+$/, "").toLowerCase();
    const p = nameIndex.get(base);
    if (p) file = filesByPath.get(p);
  }
  if (!file) return `<span class="embed-missing">imagen no encontrada: ${mdEscapeHtml(decoded)}</span>`;
  const holderId = "embed-img-" + nextId();
  pendingImages.push({ holderId, fileId: file.id, alt });
  return `<span class="embed-missing" id="${holderId}">Cargando imagen...</span>`;
}

function renderChartPlaceholder(yamlText, pendingCharts, nextId) {
  let cfg;
  try { cfg = parseChartYaml(yamlText); } catch (e) { return `<div class="empty">Grafica invalida.</div>`; }
  const holderId = "chart-" + nextId();
  pendingCharts.push({ holderId, cfg });
  return `<div class="chart-wrap"><canvas id="${holderId}"></canvas></div>`;
}

function renderDataviewJsPlaceholder(code, pendingScripts, nextId) {
  const holderId = "djs-" + nextId();
  pendingScripts.push({ holderId, code });
  return `<div class="djs-wrap" id="${holderId}"><div class="center-screen" style="height:80px;"><div class="spinner"></div></div></div>`;
}

async function resolvePendingImages(pending) {
  for (const p of pending) {
    try {
      const blob = await downloadBlob(p.fileId);
      const url = URL.createObjectURL(blob);
      const holder = document.getElementById(p.holderId);
      if (!holder) continue;
      const img = document.createElement("img");
      img.src = url; img.alt = p.alt || "";
      holder.replaceWith(img);
    } catch (e) {
      const holder = document.getElementById(p.holderId);
      if (holder) holder.textContent = "No se pudo cargar la imagen.";
    }
  }
}

function resolvePendingCharts(pending) {
  for (const p of pending) {
    const canvas = document.getElementById(p.holderId);
    if (!canvas || typeof Chart === "undefined") continue;
    try {
      const chartConfig = buildChartJsConfig(p.cfg);
      chartInstances.push(new Chart(canvas.getContext("2d"), chartConfig));
    } catch (e) {
      console.error("chart error", e);
    }
  }
}

function toggleCheckboxLine(tab, lineIndex, checked) {
  const lines = tab.content.split("\n");
  if (lineIndex < 0 || lineIndex >= lines.length) return;
  lines[lineIndex] = lines[lineIndex].replace(/\[( |x|X)\]/, checked ? "[x]" : "[ ]");
  tab.content = lines.join("\n");
  tab.dirty = true;
  saveTab(tab, null);
}

async function saveTab(tab, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Guardando..."; }
  try {
    await uploadText(tab.id, tab.content);
    tab.dirty = false;
    contentCache.set(tab.path, tab.content);
    idbSet("content", tab.id, tab.content);
    renderTabBar();
    toast("Guardado.");
    if (activeTab !== -1 && tabs[activeTab] === tab) renderNote();
  } catch (e) {
    toast("Error al guardar: " + e.message, true);
    if (btn) { btn.disabled = false; btn.textContent = "Guardar"; }
  }
}

/* ---------------- Busqueda ---------------- */

function renderSearchRow(name, path, isMd) {
  const row = el("div", { class: "tree-row" });
  const icon = isMd ? "📄" : "📎";
  row.appendChild(el("span", { class: "chev", text: "" }));
  row.appendChild(el("span", { class: "name", text: icon + " " + path }));
  row.addEventListener("click", () => {
    closeSidebar(); $("searchInput").value = ""; renderTree();
    if (isMd) openNote(path); else openOther(path);
  });
  treeEl.appendChild(row);
}

let searchDebounce = null;
$("searchInput").addEventListener("input", (ev) => {
  const q = ev.target.value.trim();
  if (!q) { renderTree(); return; }
  const qLower = q.toLowerCase();
  treeEl.innerHTML = "";
  const seenPaths = new Set();
  const localMatches = [...filesByPath.values()].filter((f) => !f.isFolder && f.name.toLowerCase().includes(qLower)).sort((a, b) => a.name.localeCompare(b.name, "es"));
  if (localMatches.length === 0) treeEl.appendChild(el("div", { class: "empty", text: "Buscando en Drive..." }));
  for (const f of localMatches) { seenPaths.add(f.path); renderSearchRow(f.name, f.path, f.name.toLowerCase().endsWith(".md")); }

  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(async () => {
    if ($("searchInput").value.trim() !== q) return; // el usuario siguio escribiendo
    try {
      const remote = await driveSearchByName(q, false);
      if ($("searchInput").value.trim() !== q) return;
      const empty = treeEl.querySelector(".empty");
      if (empty) empty.remove();
      for (const file of remote) {
        if (file.mimeType === FOLDER_MIME) continue;
        const path = await resolveFilePath(file);
        if (seenPaths.has(path)) continue;
        seenPaths.add(path);
        renderSearchRow(file.name, path, file.name.toLowerCase().endsWith(".md"));
      }
      if (seenPaths.size === 0) treeEl.appendChild(el("div", { class: "empty", text: "Sin resultados." }));
    } catch (e) {
      if (seenPaths.size === 0) treeEl.appendChild(el("div", { class: "empty", text: "Sin resultados locales (y fallo la busqueda en Drive)." }));
    }
  }, 350);
});

$("logoutBtn").addEventListener("click", logout);

showLoading("Iniciando...");
function waitForGoogle() {
  if (window.google && google.accounts && google.accounts.oauth2) initGoogle();
  else setTimeout(waitForGoogle, 100);
}
waitForGoogle();
